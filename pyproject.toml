[project]
name = "project1-zebrafish-retina"
version = "1.0.0"
description = "scRNA-seq analysis of adult zebrafish retina regeneration after MNU injury (careg:EGFP reporter)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

dependencies = [
    "scanpy>=1.10,<2.0",
    "anndata>=0.10,<0.12",
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "scipy>=1.11,<2.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<0.14",
    "h5py>=3.10",
    # Required backend for sc.tl.leiden -- Scanpy does not ship a Leiden implementation.
    "igraph>=0.11",
    "leidenalg>=0.10",
    # GO / pathway enrichment on marker lists (Python stand-in for the paper's topGO).
    "gseapy>=1.1",
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[project.optional-dependencies]
# Install ONLY if the Step 04 batch diagnostics justify integration, and record
# the decision in the Methods section when you do.
integration = ["harmonypy>=0.0.9"]

[tool.setuptools]
packages = ["scripts"]
